# EduFarm on Netlify (free tier): auto-deploy from GitHub `main`.
# Dashboard still needed (once): Site settings -> Environment variables
# (see docs/RUNBOOK.md "Deploy to Netlify" for the full list).

[build]
  base = "web"
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--no-audit --no-fund"

# Essential Next.js: SSR, API routes and middleware on Netlify's platform.
[[plugins]]
  package = "@netlify/plugin-nextjs"
